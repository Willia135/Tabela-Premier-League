<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Premier League 24/25</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Barlow', sans-serif;
  background: #111;
  color: #9e9d9d;
  padding: 40px 32px;
}

header {
  display: flex;
  align-items: baseline;
  gap: 12px;
  margin-bottom: 28px;
  border-bottom: 1px solid #222;
  padding-bottom: 16px;
}

header h1 {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 28px;
  font-weight: 700;
  color: #563d72;
  letter-spacing: 0.5px;
  text-transform: uppercase;
}

header span {
  font-size: 12px;
  color: #555;
  letter-spacing: 1px;
  text-transform: uppercase;
}

#status {
  font-size: 13px;
  color: #969696;
  margin-bottom: 20px;
  min-height: 20px;
}

table {
  width: 100%;
  border-collapse: collapse;
}

thead th {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 1.2px;
  text-transform: uppercase;
  color: #dbd7d7;
  padding: 0 8px 10px;
  text-align: right;
  border-bottom: 1px solid #1e1e1e;
}

thead th:nth-child(2) { text-align: left; padding-left: 0; }

tbody tr {
  border-bottom: 1px solid #424242;
  transition: background 0.1s;
}

tbody tr:hover { background: #161616; }

td {
  padding: 11px 8px;
  font-size: 13px;
  text-align: right;
  color: #999;
  white-space: nowrap;
}

td:first-child {
  font-size: 11px;
  color: #3a3a3a;
  font-weight: 600;
  width: 28px;
  text-align: center;
  padding-right: 4px;
}

td.name {
  text-align: left;
  padding-left: 4px;
  width: 200px;
  display: flex;
  align-items: center;
  gap: 10px;
  height: 44px;
}

td.name img {
  width: 22px;
  height: 22px;
  object-fit: contain;
  flex-shrink: 0;
  filter: drop-shadow(0 0 2px rgba(0,0,0,.6));
}

td.name span {
  font-size: 13px;
  font-weight: 500;
  color: #e0e0e0;
  letter-spacing: 0.2px;
}

td.pts {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 18px;
  font-weight: 700;
  color: #fff;
  letter-spacing: 0.5px;
}

tr.zone-cl td:first-child { color: #2e6db4; }
tr.zone-el td:first-child { color: #b46b2e; }
tr.zone-rel td:first-child { color: #993333; }

tr.sep { border-top: 1px solid #2a2a2a; }

.foot {
  display: flex;
  gap: 20px;
  margin-top: 20px;
  font-size: 11px;
  color: #8d8d8d;
  letter-spacing: 0.8px;
  text-transform: uppercase;
}

.foot span { display: flex; align-items: center; gap: 6px; }
.foot i { width: 8px; height: 8px; border-radius: 1px; display: inline-block; }
</style>
</head>
<body>

<header>
  <h1>Premier League</h1>
  <span>Temporada 2024 / 25</span>
</header>

<div id="status">Carregando dados...</div>

<table>
  <thead>
    <tr>
      <th>#</th>
      <th>Time</th>
      <th>V</th>
      <th>E</th>
      <th>Gols</th>
      <th>Pts</th>
    </tr>
  </thead>
  <tbody id="body"></tbody>
</table>

<div class="foot">
  <span><i style="background:#2e6db4"></i> Champions</span>
  <span><i style="background:#b46b2e"></i> Europa</span>
  <span><i style="background:#993333"></i> Rebaixamento</span>
  <span><i style='background:#C9A84C'></i> 👑 Campeão</span>
</div>

<script>
const imgs = {
  "Liverpool":      "https://upload.wikimedia.org/wikipedia/pt/thumb/0/0c/Liverpool_FC.svg/960px-Liverpool_FC.svg.png",
  "Arsenal":        "https://upload.wikimedia.org/wikipedia/pt/thumb/5/53/Arsenal_FC.svg/1280px-Arsenal_FC.svg.png",
  "Man City":       "https://upload.wikimedia.org/wikipedia/pt/0/02/Manchester_City_Football_Club.png",
  "Chelsea":        "https://upload.wikimedia.org/wikipedia/pt/thumb/c/cc/Chelsea_FC.svg/250px-Chelsea_FC.svg.png",
  "Aston Villa":    "https://logodownload.org/wp-content/uploads/2019/10/aston-villa-logo-1.png",
  "Newcastle":      "https://logodownload.org/wp-content/uploads/2019/10/newcastle-united-logo-0.png",
  "Nott'm Forest":  "https://upload.wikimedia.org/wikipedia/pt/a/a2/Nottingham_Forest.png",
  "Brighton":       "https://upload.wikimedia.org/wikipedia/pt/3/3f/Brighton_%26_Hove_Albion.png",
  "Brentford":      "https://upload.wikimedia.org/wikipedia/pt/5/5a/Brentford_FC.png",
  "Bournemouth":    "https://upload.wikimedia.org/wikipedia/pt/9/98/AfcBournemouth.png",
  "Fulham":         "https://upload.wikimedia.org/wikipedia/pt/thumb/1/13/Fulham_FC.svg/1920px-Fulham_FC.svg.png",
  "Crystal Palace": "https://upload.wikimedia.org/wikipedia/pt/c/c1/Crystal_Palace_FC_logo.png",
  "Everton":        "https://upload.wikimedia.org/wikipedia/pt/a/ae/Everton_FC_logo_2014.png",
  "West Ham":       "https://upload.wikimedia.org/wikipedia/pt/1/1d/West_Ham_United_FC_logo.png",
  "Man United":     "https://upload.wikimedia.org/wikipedia/pt/b/b6/Manchester_United_FC_logo.png",
  "Wolves":         "https://upload.wikimedia.org/wikipedia/pt/6/6c/Wolverhampton_Wanderers.png",
  "Tottenham":      "https://upload.wikimedia.org/wikipedia/pt/6/6d/Tottenham_Hotspur.png",
  "Leicester":      "https://upload.wikimedia.org/wikipedia/pt/0/0e/LeicesterCity_logo2014.png",
  "Ipswich":        "https://upload.wikimedia.org/wikipedia/pt/2/2a/Ipswich_Town_FC.png",
  "Southampton":    "https://upload.wikimedia.org/wikipedia/pt/thumb/5/54/Southampton_FC.svg/1920px-Southampton_FC.svg.png"
};

function parseCSV(text) {
  const lines = text.trim().split('\n');
  const headers = lines[0].split(',').map(h => h.trim().replace(/"/g, ''));
  return lines.slice(1).map(line => {
    const vals = line.split(',');
    const row = {};
    headers.forEach((h, i) => row[h] = (vals[i] || '').trim().replace(/"/g, ''));
    return row;
  });
}

function buildTable(rows) {
  const teams = {};

  rows.forEach(r => {
    const home = r['HomeTeam'];
    const away = r['AwayTeam'];
    const ftr  = r['FTR']; 
    const fthg = parseInt(r['FTHG']) || 0;
    const ftag = parseInt(r['FTAG']) || 0;

    if (!home || !away || !ftr) return;

    [home, away].forEach(t => { if (!teams[t]) teams[t] = { v: 0, e: 0, gols: 0, pts: 0 }; });

    teams[home].gols += fthg;
    teams[away].gols += ftag;

    if (ftr === 'H') { teams[home].v++; teams[away]; }
    else if (ftr === 'A') { teams[away].v++; }

    if (ftr === 'D') { teams[home].e++; teams[away].e++; }
  });

  Object.values(teams).forEach(t => { t.pts = t.v * 3 + t.e; });

  return Object.entries(teams)
    .map(([name, s]) => ({ name, ...s }))
    .sort((a, b) => b.pts - a.pts || b.v - a.v || b.gols - a.gols);
}

function getZone(pos) {
  if (pos <= 4)  return 'cl';
  if (pos <= 6)  return 'el';
  if (pos >= 18) return 'rel';
  return '';
}

function render(clubs) {
  const tbody = document.getElementById('body');
  tbody.innerHTML = '';

  clubs.forEach((c, i) => {
    const pos  = i + 1;
    const zone = getZone(pos);
    const sep  = pos === 5 || pos === 7 || pos === 18;
    const leader = pos === 1;

    const tr = document.createElement('tr');
    if (zone) tr.classList.add('zone-' + zone);
    if (sep)  tr.classList.add('sep');

    const crown = leader ? ' 👑' : '';
    const ptsColor = leader ? 'color:#C9A84C' : '';

    tr.innerHTML = `
      <td>${pos}</td>
      <td class="name"><img src="${imgs[c.name] || ''}" alt="${c.name}" onerror="this.style.display='none'"><span>${c.name}${crown}</span></td>
      <td>${c.v}</td>
      <td style="color:#555">${c.e}</td>
      <td>${c.gols}</td>
      <td class="pts" style="${ptsColor}">${c.pts}</td>`;

    tbody.appendChild(tr);
  });
}

const CSV_URL = 'tabelapremierleague.csv';
fetch(CSV_URL)
  .then(res => res.text())
  .then(text => {
    const data = parseCSV(text);
    const clubs = buildTable(data);
    render(clubs);
    document.getElementById('status').textContent = `Última atualização: ${new Date().toLocaleString()}`;
  })
  .catch(err => {
    console.error('Erro ao carregar dados:', err);
    document.getElementById('status').textContent = 'Erro ao carregar dados.';
  });
</script>
</body>
</html>
